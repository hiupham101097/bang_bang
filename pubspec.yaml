name: bangbang
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.3.0
  web_socket_channel: ^3.0.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/bang_bang_logo.png
    - assets/images/room_table.png
    - assets/images/wild_west_town.png
    - assets/images/role_sheriff.png
    - assets/images/role_deputy.png
    - assets/images/role_raider.png
    - assets/images/role_traitor.png
    - assets/images/role_guardian.png
    - assets/images/health_bullet.png
    - assets/images/cards/
    - assets/images/effects/
    - assets/images/role_cards/
    - assets/audio/western_theme.wav
    - assets/audio/splash_intro.wav
    - assets/audio/button_tap.wav
    - assets/audio/card_draw.wav
    - assets/audio/card_play.wav
    - assets/audio/bang_shot.wav
    - assets/audio/dodge.wav
    - assets/audio/damage.wav
    - assets/audio/win.wav
    - assets/audio/lose.wav
